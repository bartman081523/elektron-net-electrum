name: builds

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily
  workflow_dispatch:
    inputs:
      target:
        description: 'Which build(s) to run'
        required: true
        default: 'all'
        type: choice
        options: [all, windows, android, appimage, tarball]
      android_arch:
        description: 'Android architecture (when running android)'
        required: false
        default: 'arm64-v8a'
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64]

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false   # never kill a nightly or in-progress build

env:
  ARTIFACT_RETENTION: '14'

jobs:
  windows:
    name: "build: Windows"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0    # for git describe / version detection

      - name: Cache Wine pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-wine/.cache/win*/wine_pip_cache
          key: wine-pip-${{ hashFiles('contrib/deterministic-build/*.txt', 'contrib/build-wine/**') }}

      - name: Cache Wine native lib builds (libsecp256k1, libusb, libzbar)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-wine/.cache/win*/build
          key: wine-build-${{ hashFiles('contrib/make_libsecp256k1.sh', 'contrib/make_libusb.sh', 'contrib/make_zbar.sh', 'contrib/build-wine/**') }}

      - name: Build Windows binaries
        run: ./contrib/build-wine/build.sh

      - name: List output
        run: ls -lah contrib/build-wine/dist/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: elektron-electrum-windows-${{ github.sha }}
          path: contrib/build-wine/dist/*
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  android:
    name: "build: Android (${{ inputs.android_arch || 'arm64-v8a' }})"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      APK_ARCH: ${{ inputs.android_arch || 'arm64-v8a' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # GitHub guarantees 14 GB of free space, but we can delete some things for more space.
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/microsoft \
            /opt/pipx
          sudo docker image prune --all --force || true
          df -h

      - name: Cache python packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: packages
          # elektron fork: key must NOT include contrib/android/** — the
          # committed debug keystore (0273f31) lives there and would otherwise
          # invalidate this cache on any keystore-only change.
          key: android-packages-${{ env.APK_ARCH }}-${{ hashFiles('contrib/deterministic-build/**', 'contrib/make_packages.sh', '!contrib/android/.cache') }}

      - name: Cache buildozer (p4a)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            .buildozer_qml/android/platform/build-${{ env.APK_ARCH }}/packages
            .buildozer_qml/android/platform/build-${{ env.APK_ARCH }}/build
          # elektron fork: static key (no hashFiles) — p4a's per-package
          # .mark files already re-download changed recipes individually, so
          # hashing contrib/android/** only caused cold caches (the keystore
          # commit 0273f31 triggered one) and re-exposed the flaky recipe
          # downloads (p4a's downloader has no timeout of its own).
          key: android-buildozer-${{ env.APK_ARCH }}-v3

      - name: Build APK (debug)
        # elektron fork: p4a's downloader has no timeout, so a stalled recipe
        # download wedges the whole job (observed: pycryptodomex, pyqt_builder).
        # Cap each attempt and retry — stale runs make forward progress since
        # already-fetched packages stay marked on the cached path.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "::group::Build attempt ${attempt}"
            if timeout 50m ./contrib/android/build.sh qml "$APK_ARCH" debug; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt ${attempt} failed — removing orphaned build containers"
            docker rm -f $(docker ps -q) > /dev/null 2>&1 || true
          done
          echo "all 3 build attempts failed"
          exit 1

      - name: List output
        run: ls -lah dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: elektron-electrum-android-${{ env.APK_ARCH }}-${{ github.sha }}
          path: dist/*
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  appimage:
    name: "build: AppImage"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'appimage' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Cache AppImage pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-linux/appimage/.cache/pip_cache
          key: appimage-pip-${{ hashFiles('contrib/deterministic-build/*.txt', 'contrib/build-linux/appimage/**') }}

      - name: Cache AppImage build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: contrib/build-linux/appimage/.cache/appimage
          key: appimage-build-${{ hashFiles('contrib/make_libsecp256k1.sh', 'contrib/make_zbar.sh', 'contrib/build-linux/appimage/**') }}

      - name: Build AppImage
        run: ./contrib/build-linux/appimage/build.sh

      - name: List output
        run: ls -lah dist/

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: elektron-electrum-appimage-${{ github.sha }}
          path: dist/*.AppImage
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  tarball:
    name: "build: tarball (${{ matrix.variant }})"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'tarball' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            omit_unclean: '0'
            artifact_name: elektron-electrum-tarball
          - variant: source-only
            omit_unclean: '1'
            artifact_name: elektron-electrum-sourceonly-tarball
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Build source tarball (${{ matrix.variant }})
        env:
          OMIT_UNCLEAN_FILES: ${{ matrix.omit_unclean }}
        run: ./contrib/build-linux/sdist/build.sh

      - name: List output
        run: ls -lah dist/

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: dist/*.tar.gz
          retention-days: ${{ env.ARTIFACT_RETENTION }}
          if-no-files-found: error
          compression-level: 0

  # Only runs on a `v*` tag push (see `on.push.tags` above); the four build
  # jobs above already run unconditionally in that case (their `if:` only
  # restricts things on a manual workflow_dispatch). Collects every
  # platform's artifact from this run and attaches them all to a single
  # GitHub Release, per elektron-net-repo-conventions.md SS3.
  release:
    name: "release: GitHub Release"
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [windows, android, appimage, tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          pattern: elektron-electrum-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets/

      - name: Determine prerelease flag
        id: relflag
        run: |
          if [[ "${{ github.ref_name }}" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: "Elektron Electrum ${{ github.ref_name }}"
          prerelease: ${{ steps.relflag.outputs.prerelease }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
